services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db_bussola
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres 
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/migrations/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  api:
    build: .
    container_name: bussola_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - URI_DATABASE_BUSSOLA=postgresql://postgres:password@db:5432/bussola
      - URI_DATABASE_CHECKPOINT=postgresql://postgres:password@db:5432/checkpointers
    volumes:
      - .:/app

volumes:
  postgres_data: